id: hearing-aid-sale
skin: cover
detectors: [money, percent, duration, commission]
# Words the speech engine is prompted with instead of medicine names. On the owner's five
# recordings this kept 18 of 18 facts (15 with the medicine prompt): "for the bear" and
# "for the pay" became "for the pair", "on every cell" became "on every sale".
# A list, not a sentence: see docs/SPIKES.md (Nov 21, 2026).
speechWords:
  [hearing aids, pair, per aid, fitting, follow-up, warranty, trial, refund, finance, interest, monthly, commission, salary, sale]
disclaimer: "Echo compares what sellers said. It is not legal or financial advice and it does not recommend a purchase."
facts:
  - key: price
    fields: [amount, per]
    cues:
      anchor: "@money"
      windowWords: 15
      near: ["price", "cost", "total", "for the pair", "each"]
  - key: inclusions
    fields: [description]
    cues:
      any: ["includes?", "included", "fitting", "follow[- ]up", "warranty", "adjustments?", "batteries"]
      windowWords: 25
  - key: trial_returns
    fields: [period, terms]
    cues:
      any: ["trial", "try them", "return", "refund", "money back"]
      windowWords: 20
      optional: ["@duration"]
  - key: financing
    fields: [rate, term, monthly]
    cues:
      any: ["finance", "financing", "pay monthly", "instalments?", "interest", "apr"]
      windowWords: 25
      optional: ["@percent", "@duration", "@money"]
  - key: commission
    fields: [statement]
    cues:
      any: ["@commission"]
      windowWords: 20
checklist:
  - id: q-total-price
    text: "What is the total price per pair, and is this model sold elsewhere?"
    sourceUrl: "https://www.abc.net.au/news/2017-03-02/consumer-watchdog-puts-hearing-aid-industry-on-notice/8319738"
    verified: false
    cues:
      all: [["@money"], ["pair|each|total|price"]]
  - id: q-inclusions
    text: "What is included: fitting, follow-up visits, warranty?"
    sourceUrl: "https://www.choice.com.au/health-and-body/optical-and-hearing/hearing/articles/profit-hungry-hearing-clinics-put-on-notice-by-the-accc-030317"
    verified: false
    cues:
      any: ["includes?", "included", "fitting", "follow[- ]up", "warranty"]
  - id: q-trial-returns
    text: "How long is the trial and what are the return terms?"
    sourceUrl: "https://www.choice.com.au/health-and-body/optical-and-hearing/hearing/articles/profit-hungry-hearing-clinics-put-on-notice-by-the-accc-030317"
    verified: false
    cues:
      all: [["trial|try them"], ["@duration"]]
  - id: q-financing
    text: "If I finance it, what is the interest rate and the total repayment?"
    sourceUrl: "https://www.abc.net.au/news/2017-03-02/consumer-watchdog-puts-hearing-aid-industry-on-notice/8319738"
    verified: false
    cues:
      all: [["finance|financing|pay monthly|interest"], ["@percent"]]
  - id: q-commission
    text: "Do staff earn commission on this sale?"
    sourceUrl: "https://www.abc.net.au/news/2017-03-02/consumer-watchdog-puts-hearing-aid-industry-on-notice/8319738"
    verified: false
    cues:
      any: ["@commission"]
nextSteps:
  - label: "Send the confirm-in-writing message and keep the reply"
