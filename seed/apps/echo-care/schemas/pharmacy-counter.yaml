id: pharmacy-counter
skin: care
detectors: [number, drug, frequency]
disclaimer: "Echo records and summarises what was said. It is not medical advice and not an interpreter."
facts:
  - key: medicine
    fields: [name, strength, how_to_take]
    cues:
      anchor: "@drug"
      windowWords: 30
      optional: ["@number", "@frequency"]
  - key: side_effects
    fields: [description]
    cues:
      any: ["side effects?", "can include", "may cause", "feel sick", "upset stomach", "dizz"]
      windowWords: 25
  - key: missed_dose
    fields: [description]
    cues:
      any: ["miss a dose", "forget to take", "missed a dose"]
      windowWords: 25
checklist:
  - id: q-how-when
    text: "How and when do I take it, with or without food?"
    sourceUrl: user-planned
    cues:
      all: [["@frequency|morning|evening|night"], ["food|meal|empty stomach"]]
  - id: q-side-effects
    text: "What side effects should I expect?"
    sourceUrl: user-planned
    cues:
      any: ["side effects?", "may cause", "can include", "feel sick"]
  - id: q-missed-dose
    text: "What if I miss a dose?"
    sourceUrl: user-planned
    cues:
      any: ["miss a dose", "forget to take", "missed a dose"]
  - id: q-avoid
    text: "Is there anything I should avoid while taking it?"
    sourceUrl: user-planned
    cues:
      any: ["avoid", "do not drink", "don't drink", "alcohol", "grapefruit"]
  - id: q-storage
    text: "How should I store it?"
    sourceUrl: user-planned
    cues:
      any: ["store", "keep (them|it|the tablets)", "cool", "dry place", "fridge"]
nextSteps:
  - label: "Ask the pharmacist to write down anything marked Check this"
