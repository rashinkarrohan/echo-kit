name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Lint, typecheck, test, evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Version comes from "packageManager" in package.json, the same one Vercel installs with.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check .kiro is NOT in .gitignore
        run: node scripts/check-gitignore.mjs

      - name: Check copy for advice wording
        run: pnpm check:copy
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Evals
        run: pnpm evals

      # The harness must be able to fail: with a deliberately broken extractor it has to exit non-zero.
      - name: Evals fail with a broken extractor
        run: "! pnpm evals --break"

      - name: Audit production dependencies
        run: pnpm audit --prod

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        app: [echo-care, echo-cover]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter ${{ matrix.app }} exec playwright install --with-deps chromium
      - name: Playwright with axe checks
        run: pnpm --filter ${{ matrix.app }} e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.app }}
          path: apps/${{ matrix.app }}/test-results
